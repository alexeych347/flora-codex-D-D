services:
  - type: web
    name: flora-codex-api
    env: node
    plan: free
    buildCommand: cd server && npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flora-codex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PLAYER_VELIMIR_PASSWORD
        value: change-me-in-render-dashboard
      - key: PLAYER_MIDSOMMAR_PASSWORD
        value: change-me-in-render-dashboard
      - key: PLAYER_LEIV_PASSWORD
        value: change-me-in-render-dashboard
      - key: PLAYER_BELOGOR_PASSWORD
        value: change-me-in-render-dashboard
      - key: MASTER_PASSWORD
        value: change-me-in-render-dashboard
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://flora-codex-client.onrender.com

  - type: web
    name: flora-codex-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://flora-codex-api.onrender.com

databases:
  - name: flora-codex-db
    plan: free
